services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aq_postgis
    environment:
      POSTGRES_USER: aq
      POSTGRES_PASSWORD: aq
      POSTGRES_DB: aqdb
    ports:
      - "5432:5432"
    volumes:
      - aq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aq -d aqdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aero_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://aq:aq@db:5432/aqdb
      - AQ_SOURCE=live
      - WEATHER_SOURCE=live
      - CORS_ORIGINS=*
      - PORT=8000
      - HOST=0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aero_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  aq_pgdata:

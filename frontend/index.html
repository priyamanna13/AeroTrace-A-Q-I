<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/aerotrace-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroTrace A(Q)I — Atmospheric Forensic Attribution & Environmental Intelligence</title>
    <meta name="description" content="AeroTrace A(Q)I — Trace the air. Understand the source. PJMT National Green Earth Challenge 2026." />

    <!-- Restore the persisted GLOBAL theme BEFORE first paint (prevents flash +)
         guarantees useThemeTransition's class-based initializer reads the right
         value. 'aerotrace_theme' is written by useThemeTransition (Settings). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aerotrace_theme');
          document.documentElement.classList.add(saved === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Google Fonts: Bodoni Moda (Display), Archivo (Sans), Noto Devanagari -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
